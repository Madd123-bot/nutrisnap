<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>NutriSnap PRO</title>

<style>
:root{
 --bg:#f0f7ff;
 --card:#ffffff;
 --primary:#377CFF;
 --primary-gradient:linear-gradient(135deg,#377CFF,#00C6FF);
 --accent-gradient:linear-gradient(135deg,#2dce89,#2dcecc);
 --radius:16px;
 font-family:Inter,Segoe UI,Roboto;
}

body{margin:0;background:var(--bg);}
.hidden{display:none!important;}
.screen{display:none}
.screen.active{display:block}

.login-card,.stat-card,.list-item{
 backdrop-filter:blur(10px);
 background:rgba(255,255,255,.8);
 border-radius:16px;
 padding:15px;
 margin-bottom:12px;
}

.trend-down{color:#2dce89;background:#e6fffa;padding:2px 8px;border-radius:12px;font-size:12px}
.trend-up{color:#f5365c;background:#fff5f5;padding:2px 8px;border-radius:12px;font-size:12px}
.trend-same{color:#fbbf24;background:#fffbeb;padding:2px 8px;border-radius:12px;font-size:12px}

.stat-val{font-size:22px;font-weight:800}
.stat-label{font-size:11px;color:#888}

button{padding:10px;border:none;border-radius:10px;background:var(--primary-gradient);color:#fff}
input{padding:10px;width:100%;margin-bottom:10px}
</style>
</head>

<body>

<div id="app">

<section id="login" class="screen active">
<div class="login-card">
<h2>NutriSnap</h2>
<button onclick="forceOfflineLogin()">Masuk (Offline Demo)</button>
</div>
</section>

<section id="onboarding" class="screen">
<div class="login-card">
<h3>Pilih Matlamat</h3>
<input type="number" id="onboardGoalWeight" placeholder="Goal Weight">
<select id="goalType">
<option value="lose">Turun Berat</option>
<option value="gain">Naik Berat</option>
</select>
<button onclick="saveOnboarding()">Simpan</button>
</div>
</section>

<section id="home" class="screen">
<h3>Kalori Hari Ini</h3>
<div class="stat-card">
<div id="calBalance" class="stat-val">0</div>
<div class="stat-label">Kalori</div>

<div style="margin-top:10px;">
<div style="background:#eee;height:10px;border-radius:10px;overflow:hidden;">
<div id="calProgressBar" style="height:100%;width:0%;background:linear-gradient(90deg,#377CFF,#2dce89);transition:.5s"></div>
</div>
</div>
</div>

<button onclick="showScreen('upload')">Snap Makanan</button>
<button onclick="showScreen('weight')">Berat</button>
</section>

<section id="upload" class="screen">
<div class="login-card">
<input type="file" accept="image/*" onchange="handleImageUpload(this)">
</div>
</section>

<section id="weight" class="screen">
<div id="streakBox" class="stat-card"></div>
<input type="number" id="inpWeight" placeholder="Berat kg">
<button onclick="saveWeight()">Simpan Berat</button>
<canvas id="weightChart" height="150"></canvas>
<div id="weightHistory"></div>
<button onclick="showScreen('home')">Back</button>
</section>

</div>

<script>

// ================= STATE =================
let currentUser=null;
let mealLogs=[];
let weightLogs=[];

// ================= NAV =================
function showScreen(id){
 document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 if(id==="home")renderHomeStats();
 if(id==="weight")renderWeightLogs();
}

// ================= LOGIN =================
function forceOfflineLogin(){
 currentUser={uid:"offline"};
 calculateCalorieTarget();
 if(!localStorage.getItem('userGoal')) showScreen('onboarding');
 else showScreen('home');
}

// ================= ONBOARD =================
function saveOnboarding(){
 const goal=document.getElementById('onboardGoalWeight').value;
 const type=document.getElementById('goalType').value;
 localStorage.setItem('userGoal',goal);
 localStorage.setItem('goalType',type);
 calculateCalorieTarget();
 showScreen('home');
}

// ================= AI MEMORY =================
function updateFoodMemory(foodName){
 let mem=JSON.parse(localStorage.getItem('aiFoodMemory')||"{}");
 mem[foodName]=(mem[foodName]||0)+1;
 localStorage.setItem('aiFoodMemory',JSON.stringify(mem));
}

function getSmartFoodPick(list){
 const mem=JSON.parse(localStorage.getItem('aiFoodMemory')||"{}");
 const weighted=[];
 list.forEach(f=>{
  const w=(mem[f.name]||1);
  for(let i=0;i<w;i++) weighted.push(f);
 });
 return weighted[Math.floor(Math.random()*weighted.length)];
}

// ================= FAKE AI =================
function fakeAIDetectFood(){

 const foods=[
 {name:"Nasi Lemak",cal:500,protein:15,carbs:65},
 {name:"Mee Goreng",cal:600,protein:18,carbs:85},
 {name:"Ayam Goreng",cal:300,protein:28,carbs:10},
 {name:"Burger",cal:550,protein:25,carbs:50},
 {name:"Salad Ayam",cal:250,protein:30,carbs:15},
 {name:"Sandwich",cal:320,protein:14,carbs:35}
 ];

 const portions=[
 {label:"Small",mult:0.7},
 {label:"Medium",mult:1},
 {label:"Large",mult:1.3}
 ];

 const food=getSmartFoodPick(foods);
 const portion=portions[Math.floor(Math.random()*portions.length)];
 const confidence=Math.floor(Math.random()*20)+80;

 return{
  name:food.name,
  portion:portion.label,
  confidence:confidence,
  calories:Math.round(food.cal*portion.mult),
  protein:Math.round(food.protein*portion.mult),
  carbs:Math.round(food.carbs*portion.mult)
 };
}

// ================= IMAGE AI =================
function handleImageUpload(input){

 const reader=new FileReader();

 reader.onload=function(e){

 const ai=fakeAIDetectFood();

 let badge=ai.confidence>90?"🟢 Tinggi":"🟡 Sederhana";

 if(confirm(
`AI Detect: ${ai.name}
Portion: ${ai.portion}
Confidence: ${ai.confidence}% (${badge})

${ai.calories} kcal • ${ai.protein}g protein • ${ai.carbs}g carbs

Simpan?`)){

  updateFoodMemory(ai.name);

  mealLogs.push({...ai,date:getTodayDate(),image:e.target.result});
  localStorage.setItem('mealLogs',JSON.stringify(mealLogs));
  showScreen('home');
 }
 }

 reader.readAsDataURL(input.files[0]);
}

// ================= CALORIE TARGET =================
function calculateCalorieTarget(){
 const goalType=localStorage.getItem('goalType')||"lose";
 let base=2200;
 if(goalType==="lose")base-=400;
 else base+=400;
 localStorage.setItem('calorieTarget',base);
}

// ================= HOME =================
function renderHomeStats(){

 mealLogs=JSON.parse(localStorage.getItem('mealLogs')||"[]");

 const today=getTodayDate();
 const logs=mealLogs.filter(l=>l.date===today);

 const used=logs.reduce((a,b)=>a+(b.calories||0),0);
 const target=parseInt(localStorage.getItem('calorieTarget')||2000);

 document.getElementById('calBalance').innerText=`${used} / ${target}`;

 const percent=Math.min((used/target)*100,100);
 document.getElementById('calProgressBar').style.width=percent+"%";
}

// ================= WEIGHT =================
function saveWeight(){

 const w=parseFloat(document.getElementById('inpWeight').value);
 if(!w)return;

 weightLogs=JSON.parse(localStorage.getItem('weightLogs')||"[]");
 weightLogs.push({weight:w,date:getTodayDate()});
 localStorage.setItem('weightLogs',JSON.stringify(weightLogs));

 renderWeightLogs();
}

// ===== STREAK =====
function calculateWeightStreak(){

 if(weightLogs.length<2)return 1;

 const logs=[...weightLogs].sort((a,b)=>new Date(b.date)-new Date(a.date));
 let streak=1;

 for(let i=0;i<logs.length-1;i++){
  const d1=new Date(logs[i].date);
  const d2=new Date(logs[i+1].date);
  const diff=(d1-d2)/(1000*60*60*24);
  if(diff===1)streak++;
  else break;
 }

 return streak;
}

// ===== GRAPH =====
function drawWeightChart(){

 const canvas=document.getElementById('weightChart');
 const ctx=canvas.getContext('2d');

 ctx.clearRect(0,0,canvas.width,canvas.height);

 if(weightLogs.length<2)return;

 const logs=[...weightLogs].sort((a,b)=>new Date(a.date)-new Date(b.date));
 const weights=logs.map(l=>l.weight);

 const max=Math.max(...weights);
 const min=Math.min(...weights);

 const padding=20;
 const w=canvas.width;
 const h=canvas.height;

 ctx.beginPath();

 logs.forEach((l,i)=>{
  const x=padding+(i*(w-padding*2)/(logs.length-1));
  const y=h-((l.weight-min)/(max-min||1))*(h-padding*2)-padding;
  if(i===0)ctx.moveTo(x,y);
  else ctx.lineTo(x,y);
 });

 ctx.lineWidth=3;
 ctx.strokeStyle="#377CFF";
 ctx.stroke();
}

// ===== RENDER WEIGHT =====
function renderWeightLogs(){

 weightLogs=JSON.parse(localStorage.getItem('weightLogs')||"[]");
 const container=document.getElementById('weightHistory');

 const logs=[...weightLogs].sort((a,b)=>new Date(b.date)-new Date(a.date));

 let html="";

 logs.forEach((log,index)=>{

 const prevLog=logs[index+1];
 let trendHtml="";
 const goalType=localStorage.getItem('goalType')||"lose";

 if(prevLog){
  const diff=log.weight-prevLog.weight;

  if(goalType==="lose"){
   if(diff<0)trendHtml=`<span class="trend-down">▼ ${Math.abs(diff).toFixed(1)}kg</span>`;
   else if(diff>0)trendHtml=`<span class="trend-up">▲ ${diff.toFixed(1)}kg</span>`;
   else trendHtml=`<span class="trend-same">—</span>`;
  }else{
   if(diff>0)trendHtml=`<span class="trend-down">▲ ${diff.toFixed(1)}kg</span>`;
   else if(diff<0)trendHtml=`<span class="trend-up">▼ ${Math.abs(diff).toFixed(1)}kg</span>`;
   else trendHtml=`<span class="trend-same">—</span>`;
  }
 }

 html+=`<div class="list-item">
 ${log.date} - ${log.weight}kg ${trendHtml}
 </div>`;
 });

 container.innerHTML=html;

 const streak=calculateWeightStreak();
 document.getElementById('streakBox').innerHTML=
 `<div class="stat-val">🔥 ${streak}</div>
 <div class="stat-label">Hari Berturut Log Berat</div>`;

 drawWeightChart();
}

// ================= UTILS =================
function getTodayDate(){
 const d=new Date();
 return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().split('T')[0];
}

</script>
</body>
</html>
